services:
  demo-rosbridge:
    build:
      context: ./ros2-demo
    image: robotflowlabs/roboros-demo:local
    init: true
    ports:
      - "9090:9090"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/9090'"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped
